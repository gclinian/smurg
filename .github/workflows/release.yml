# A release: push a tag vX.Y.Z (CHANGELOG.md must have a `## [X.Y.Z] - YYYY-MM-DD` section) and this workflow
#   1. checks the tag, the changelog and that nothing is left to fill in (scripts/release-assets.sh --publish-checks:
#      the dated section in both changelogs, no placeholder, DEFAULT_RELAY_URL set and named in the user docs with
#      the install line, the MIT LICENSE, every package.json at X.Y.Z, MIT and private), before any runner time is
#      spent on builds;
#   2. builds the single executable on each target's own runner with scripts/build-sea.sh --version X.Y.Z --target …,
#      which also checks that it runs there, smoke-tests it (packages/cli/test/sea.test.ts) and writes next to it the
#      THIRD-PARTY-NOTICES.txt it embeds;
#   3. assembles the release with scripts/release-assets.sh: the four executables, SHA256SUMS, install.sh with this
#      version's download location baked in (https://downloads.smurg.ai/vX.Y.Z), THIRD-PARTY-NOTICES.txt (the four
#      builds' must be identical), plus the notes (the CHANGELOG section, the install line, the checksums);
#   4. keeps those seven files as the workflow artifact release-X.Y.Z (30 days), and creates the GitHub release
#      vX.Y.Z with the notes, SHA256SUMS and THIRD-PARTY-NOTICES.txt (created as a draft, its asset list checked, then
#      published; latest unless the version has a pre-release part such as 0.5.0-rc.1). The GitHub release carries no
#      executable and no installer: the one download place is https://downloads.smurg.ai.
# It uploads nothing to the downloads domain. A maintainer then runs, from a checkout with wrangler logged in to the
# Cloudflare account (docs/RELEASING.md §1.2), the command the job summary prints:
#     scripts/publish-downloads.sh --version X.Y.Z --from-release
# which takes the artifact of this run (their gh login), checks the files again and against the GitHub release's
# SHA256SUMS, uploads them to the Cloudflare R2 bucket smurg-downloads (https://downloads.smurg.ai/vX.Y.Z/, never
# overwritten), reads every file back, and only then points latest/ at the version, where the one-line install
#     curl -fsSL https://smurg.ai/install.sh | sh
# lands (smurg.ai, apps/site, answers it with a 302 to https://downloads.smurg.ai/latest/install.sh). No Cloudflare
# credential is stored in GitHub, and this workflow deploys nothing: the shared relay and smurg.ai are redeployed by
# hand from the tagged commit (docs/RELEASING.md §4 step 3).
#
# Only a tag push (write access) or a manual run starts it; it never runs for a pull request.
#
# Runners (https://github.com/actions/runner-images README, read 2026-09-30; docs.github.com "GitHub-hosted runners
# reference"):
#   darwin-arm64  macos-15         (not macos-14: deprecated, brownouts from 2026-10-05, removed 2026-11-02, #13518)
#   darwin-x64    macos-15-intel   (not macos-13: removed 2025-12-04, #13046; macos-15-intel is the x86_64 image
#                                   GitHub keeps until August 2027, #13045)
#   linux-x64     ubuntu-24.04
#   linux-arm64   ubuntu-24.04-arm (should it ever wait for a runner, docs/RELEASING.md §4.3 builds that one target
#                                   on an arm64 Ubuntu 24.04 machine)
# The executable is a copy of the official Node the job installs (.nvmrc's major, the newest release of it on every
# runner: check-latest, because the runners' caches can hold different patch releases), so the runner's macOS version
# does not limit where it runs, and the four embed the same Node.js LICENSE. macOS builds are signed ad hoc only (no
# Apple account); install.sh removes the quarantine attribute after verifying the sha256.
#
# Manual run (Actions → Release → Run workflow): a DRY RUN of the same pipeline for the version given, from the chosen
# branch. Everything is built, checked and assembled; no GitHub release is made (the notes, SHA256SUMS, install.sh and
# THIRD-PARTY-NOTICES.txt are kept as the artifact release-dry-run-<version>). In a dry run the --publish-checks step
# only warns, so it also works before everything is filled in.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Dry run (nothing is published) of this version, X.Y.Z; CHANGELOG.md needs its section
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # scripts/env.sh prefers a Node installed by nvm, and the Ubuntu images ship nvm: use setup-node's Node (.nvmrc).
  NVM_DIR: /dev/null/no-nvm

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: tag and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      base-url: ${{ steps.version.outputs.base-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        name: Version from the tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then tag="$GITHUB_REF_NAME"; else tag="v${INPUT_VERSION#v}"; fi
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,6}(-[0-9A-Za-z.-]{1,40})?$ ]] || { echo "::error::$tag is not a version tag vX.Y.Z (or vX.Y.Z-pre.N)"; exit 1; }
          # The version's own prefix on the public downloads domain (Cloudflare R2; scripts/publish-downloads.sh).
          base_url="https://downloads.smurg.ai/$tag"
          { echo "version=$version"; echo "tag=$tag"; echo "base-url=$base_url"; } >>"$GITHUB_OUTPUT"
          echo "smurg $version, download location $base_url ($EVENT)"

      - name: CHANGELOG.md has a section for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-assets.sh --version "$VERSION" --check-changelog

      - name: Nothing left to fill in (docs/RELEASING.md §3, §4)
        # A tag must pass; a manual dry run only warns (the step shows as failed, the run goes on).
        continue-on-error: ${{ github.event_name != 'push' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-assets.sh --version "$VERSION" --publish-checks

  build:
    name: smurg-${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # Every target reports; the release job needs all four anyway.
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The newest release of that major on every runner, not whatever each image has cached: the four
          # executables (and the Node.js LICENSE in their notices) then come from the same Node.
          check-latest: true
          package-manager-cache: false

      - name: Repo-local pnpm
        run: scripts/bootstrap-tools.sh

      - name: Install dependencies
        run: |
          # shellcheck source=/dev/null # scripts/env.sh ends with a top-level return, which shellcheck reads as an exit
          source scripts/env.sh
          pnpm install --frozen-lockfile

      - name: Build, check and smoke-test smurg-${{ matrix.target }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: scripts/build-sea.sh --version "$VERSION" --target "$TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smurg-${{ matrix.target }}
          path: packages/cli/dist/smurg-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

      # The notices this executable embeds (scripts/build-sea.sh writes them next to it).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notices-${{ matrix.target }}
          path: packages/cli/dist/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release (notes, checksums, notices)
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      BASE_URL: ${{ needs.prepare.outputs.base-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smurg-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: notices-*
          path: notices

      - name: "Third-party notices: the four builds embed the same"
        run: |
          set -euo pipefail
          files=(notices/notices-*/THIRD-PARTY-NOTICES.txt)
          [ "${#files[@]}" = 4 ] || { echo "::error::expected the notices of four builds, found ${#files[@]}: ${files[*]}"; exit 1; }
          for file in "${files[@]:1}"; do
            if ! cmp -s "${files[0]}" "$file"; then
              echo "::error::$file differs from ${files[0]}: the builds embed different notices (another Node.js release came out during the run?). Re-run all jobs."
              diff "${files[0]}" "$file" | head -40 || true
              exit 1
            fi
          done
          cp "${files[0]}" dist/THIRD-PARTY-NOTICES.txt

      - name: Release files and notes
        run: |
          set -euo pipefail
          scripts/release-assets.sh --version "$VERSION" --base-url "$BASE_URL" --dist dist --out release \
            --require-all --check-arch --notes "$RUNNER_TEMP/release-notes.md"
          ls -l release
          cat "$RUNNER_TEMP/release-notes.md"

      - name: "Dry run: keep the notes, SHA256SUMS, install.sh and the notices"
        if: github.event_name != 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/dry-run"
          cp release/SHA256SUMS release/install.sh release/THIRD-PARTY-NOTICES.txt "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/dry-run/"

      - if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/dry-run
          if-no-files-found: error
          retention-days: 7

      # The seven files a maintainer publishes on downloads.smurg.ai (scripts/publish-downloads.sh --from-release).
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: |
            release/smurg-darwin-arm64
            release/smurg-darwin-x64
            release/smurg-linux-x64
            release/smurg-linux-arm64
            release/SHA256SUMS
            release/install.sh
            release/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 30

      - name: "The GitHub release: notes, SHA256SUMS and the notices (no executables)"
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases() { gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq "$1"; }
          existing="$(releases ".[] | select(.tag_name == \"$TAG\") | .html_url")"
          if [ -n "$existing" ]; then
            echo "::error::a release for $TAG already exists (draft or published): $existing. Delete it on the Releases page, then re-run this job."
            exit 1
          fi
          prerelease=()
          make_latest=true
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); make_latest=false; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "smurg $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}" \
            release/SHA256SUMS release/THIRD-PARTY-NOTICES.txt
          id="$(releases ".[] | select(.tag_name == \"$TAG\" and .draft) | .id")"
          [ "$(printf '%s\n' "$id" | grep -c .)" = 1 ] || { echo "::error::expected one draft release for $TAG, found: $id"; exit 1; }
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '[.assets[] | select(.state == "uploaded") | .name] | sort | join(" ")')"
          expected='SHA256SUMS THIRD-PARTY-NOTICES.txt'
          [ "$assets" = "$expected" ] || { echo "::error::the draft of $TAG has [$assets], not [$expected]; it stays a draft"; exit 1; }
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -f make_latest="$make_latest" --jq '"released " + .html_url'

      - name: "Next: publish (job summary)"
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          {
            echo "## smurg $VERSION"
            echo
            if [ "$EVENT" = push ]; then
              echo "The GitHub release $TAG has the notes, SHA256SUMS and the notices; the seven files to publish are this run's artifact release-$VERSION (kept 30 days). **The executables are not on https://downloads.smurg.ai yet.**"
              echo "To publish them (a maintainer with wrangler logged in to the Cloudflare account; docs/RELEASING.md §4):"
              echo
              echo '```sh'
              echo 'cd <repo> && source scripts/env.sh'
              echo "scripts/publish-downloads.sh --version $VERSION --from-release --dry-run"
              echo "scripts/publish-downloads.sh --version $VERSION --from-release"
              echo "scripts/publish-downloads.sh --check --version $VERSION"
              echo '```'
            else
              echo "Dry run: no GitHub release was made and nothing was published (the files are the artifact release-dry-run-$VERSION)."
              echo "A real release: push the tag $TAG; this summary then gives the command that publishes it:"
              echo
              echo '```sh'
              echo "scripts/publish-downloads.sh --version $VERSION --from-release"
              echo '```'
            fi
            echo
            if [[ "$VERSION" == *-* ]]; then
              echo "$VERSION is a pre-release: it is uploaded to $BASE_URL/ but never becomes latest/."
              echo "Try it with \`curl -fsSL $BASE_URL/install.sh | sh\`."
            else
              echo "Once published, \`curl -fsSL https://smurg.ai/install.sh | sh\` installs $VERSION."
            fi
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
